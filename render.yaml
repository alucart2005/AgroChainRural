# Blueprint de Render para el backend de AgroChain Rural.
#
# En Render: New → Blueprint → elegir este repositorio; el servicio se crea con
# este archivo. Los valores con `sync: false` se completan en el panel
# (Settings → Environment) la primera vez.
#
# IMPORTANTE — por qué el backend va en Render y NO en Vercel:
# las funciones serverless de Vercel (plan Hobby) se cortan a los 10 s, y el
# anclaje en NEAR puede superarlo con holgura (espera de finalización + 3
# reintentos ante fallos transitorios del RPC). Además el filesystem de Vercel
# es efímero, así que un SQLite allí solo sirve de instantánea de solo lectura
# que se pierde en cada deploy.
services:
  - type: web
    name: agrochain-backend
    runtime: docker
    rootDir: backend
    plan: free
    # Oregon queda a ~60 ms del proyecto Neon (aws-us-east-2, Ohio): la
    # diferencia es imperceptible en las consultas del piloto y mantiene el
    # servicio en la región que ya usaba el proyecto.
    region: oregon
    healthCheckPath: /api/health
    envVars:
      # Base de datos: proyecto Neon "AgroChainRural" (aws-us-east-2).
      # Pegar el connection string DEL POOLER (el que termina en -pooler):
      # el servicio web hace muchas conexiones cortas y el endpoint directo
      # agotaría las conexiones simultáneas del plan gratuito.
      - key: DATABASE_URL
        sync: false
      # API key de escritura (header X-API-Key).
      # ATENCIÓN: el frontend la necesita en el navegador, así que se publica
      # como NEXT_PUBLIC_API_KEY y CUALQUIER visitante puede leerla en el
      # bundle JS. Solo disuade usos accidentales; no es un secreto real.
      - key: API_KEY
        generateValue: true
      # Google OAuth (HU-06): Client ID de Google Cloud Console (pantalla de
      # consentimiento + orígenes autorizados). El popup NO usa el secret.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Secreto de los JWT de sesión (HS256). Generar con `openssl rand -hex 32`
      # y pegarlo en el panel. NO use generateValue: un valor nuevo en cada
      # deploy cerraría la sesión de todos los productores.
      - key: AUTH_SECRET
        sync: false
      # NEAR Testnet — la cuenta y la clave se crean con
      # `python -m scripts.near_account create <cuenta.testnet>` y se pegan en
      # el panel; la clave secreta jamás viaja al repositorio.
      - key: NEAR_NETWORK
        value: testnet
      # RPC público de NEAR Testnet. La verificación lee el ESTADO del
      # contrato (`view get`), no el histórico de transacciones: ese detalle
      # caduca en el RPC público, el estado no.
      - key: NEAR_RPC_URL
        value: https://test.rpc.fastnear.com
      # Cuenta que firma los anclajes (recibe el faucet una sola vez).
      - key: NEAR_ACCOUNT_ID
        sync: false
      # Clave ed25519 de esa cuenta (incluye el prefijo `ed25519:`).
      - key: NEAR_PRIVATE_KEY
        sync: false
      # Cuenta donde está desplegado contract/res/agrochain_kv.wasm
      # (python -m scripts.desplegar_contrato).
      - key: NEAR_CONTRACT_ID
        sync: false
      # Cloudflare R2 (evidencia fotográfica; nunca sube a la blockchain).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: agrochain-evidence
      - key: R2_PUBLIC_URL
        sync: false
      # Origen permitido (CORS) del frontend de Vercel. El frontend llama al
      # backend DIRECTAMENTE con NEXT_PUBLIC_API_URL: no hay rewrite en
      # vercel.json porque Vercel no interpola variables de entorno allí.
      - key: FRONTEND_URL
        value: https://agrochain-frontend-kappa.vercel.app
