[package]
name = "agrochain-kv"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Contrato KV de AgroChain Rural: ancla el SHA-256 de un lote en NEAR Testnet"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
